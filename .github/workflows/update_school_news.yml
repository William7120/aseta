name: Tự Động Cập Nhật Thông Báo THPT Trần Văn Giàu

on:
  schedule:
    # 06:30, 11:30, 17:30, 20:30 (Giờ Việt Nam UTC+7 -> UTC: 23:30, 04:30, 10:30, 13:30)
    - cron: '30 23,4,10,13 * * *'
    # Chiều Thứ Bảy & Chủ Nhật (khi trường đăng lịch tuần mới): 15:30, 17:30, 19:30 (UTC: 8:30, 10:30, 12:30)
    - cron: '30 8,10,12 * * 0,6'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay bất cứ lúc nào

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Quét thông báo từ website THPT Trần Văn Giàu
        run: node scripts/scrape_school_news.js

      - name: Đẩy dữ liệu mới lên GitHub Pages (nếu có thay đổi)
        run: |
          git config --global user.name "Aseta School Bot"
          git config --global user.email "bot@aseta.edu.vn"
          git add data/school_news.json data/pdf/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): cap nhat lich tuan va ban tru TVG tu dong" && git push)
