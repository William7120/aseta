name: Tự Động Cập Nhật Thông Báo THPT Trần Văn Giàu

on:
  schedule:
    # Chạy tự động mỗi 30 phút từ 6h00 sáng đến 22h30 tối (giờ Việt Nam UTC+7 -> UTC 23:00 - 15:30)
    - cron: '*/30 23,0-15 * * *'
    # Chiều Thứ Bảy & Chủ Nhật (khi trường thường đăng lịch tuần mới): mỗi 15 phút
    - cron: '*/15 8-15 * * 0,6'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay bất cứ lúc nào

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt Python & thư viện chuyển đổi PDF sang ảnh
        run: |
          python3 -m pip install --upgrade pip
          pip install pypdfium2 Pillow

      - name: Quét thông báo từ website THPT Trần Văn Giàu & tạo ảnh thực đơn
        run: node scripts/scrape_school_news.js

      - name: Đẩy dữ liệu mới lên GitHub Pages (nếu có thay đổi)
        run: |
          git config --global user.name "Aseta School Bot"
          git config --global user.email "bot@aseta.edu.vn"
          git add data/school_news.json data/exam_hk1_schedule.json data/pdf/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): cap nhat lich tuan va ban tru TVG tu dong" && git push)
